<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--<link rel="icon" type="image/svg+xml" href="/favicon.svg" />-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3jstestmap</title>
  </head>
  <body>

    <canvas id="canvas" style="display: block; width: 100%; height: 90%;"></canvas>

    <div style="top: 90vh; position: fixed;">
      <p style="margin: 0px"> controls </p>
      <div style="display: flex; gap: 5px; height: 40px">
        <p          id="livepos"  >current location</p>
        <textarea   id="lonin"    style="width: 50px;">lon</textarea>
        <textarea   id="latin"    style="width: 50px;">lat</textarea>
        <button     id="gotopos"  >go</button>
        <div                      style="width: 20px"></div>
        <p          id="dir"      style="width: 30px">map orientation</p>
        <button     id="north"    >north</button>
        <div                      style="width: 20px"></div>
        <button     id="poi"      >poi</button>
        <button     id="wide"     >wide</button>
        <input      id="angle"    type="range" min="0" max="100" value="0" style="width: 100px;"></input>
      </div>
    </div>
